<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colorfly Studio</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/app.js" defer></script>
</head>

<body>

    <header class="site-header">
        <div class="site-brand">
            <img src="assets/logo_colorfly.png" alt="Colorfly Studio logo" class="site-logo" />
            <div class="site-text">
                <h1 class="site-title">
                    <span class="title-colorfly"> Colorfly </span> Studio
                </h1>
                <p class="site-subtitle">Generador de paletas para equipos creativos</p>
            </div>
        </div>
    </header>

    <main class="main-content">

        <section class="controls" aria-label="Opciones de generación">

            <div class="control-group">
                <p class="control-label">Tamaño de paleta</p>
                <div class="size-selector">
                    <button type="button" class="size-btn active" data-size="6">6</button>
                    <button type="button" class="size-btn" data-size="8">8</button>
                    <button type="button" class="size-btn" data-size="9">9</button>
                </div>
            </div>

            <div class="control-group">
                <p class="control-label">Formato</p>
                <div class="format-selector">
                    <label>
                        <input type="radio" name="format" value="hex" checked /> HEX
                    </label>
                    <label>
                        <input type="radio" name="format" value="hsl" /> HSL
                    </label>
                </div>
            </div>

            <button type="button" class="btn-generate" id="btn-generate" aria-label="Generar nueva paleta de colores">
                Generar paleta
            </button>

        </section>

        <!-- Extra: botón guardar paleta — visible solo después de generar -->
        <div class="save-bar hidden" id="save-bar">
            <button type="button" class="btn-save" id="btn-save" title="Guardar paleta actual">
                Guardar paleta
            </button>
        </div>

        <p class="usage-hint hidden"></p>

        <div class="active-format" id="active-format"></div>

        <section class="palette-container" id="palette-container" aria-label="Paleta generada" aria-live="polite">
        </section>

        <!-- Extra: paletas guardadas -->
        <section class="saved-section hidden" id="saved-section" aria-label="Paletas guardadas">
            <h2 class="saved-title">Paletas guardadas</h2>
            <div class="saved-container" id="saved-container"></div>
        </section>

        <div class="toast" id="toast-notification" role="status" aria-live="polite"></div>

    </main>

    <footer class="site-footer">
        <p class="footer-disclaimer">
            © 2026 Juan Castellanos. Proyecto independiente diseñado para portafolio personal.
        </p>
        <div class="footer-socials">
            <a href="https://github.com/DonJuanC" target="_blank" aria-label="GitHub" title="Visita mi GitHub">
                GitHub 🐙
            </a>
            <a href="https://www.linkedin.com/in/juan-camilo-castellanos-uribe-71344321a" target="_blank" aria-label="LinkedIn" title="Contáctame en LinkedIn">
                LinkedIn 💼
            </a>
            
            <a href="mailto:cocreemoscolectivo@gmail.com" target="_blank" aria-label="Email" title="Contáctame por correo">
                Correo 📨
            </a>
        </div>
    </footer>

</body>

</html>
